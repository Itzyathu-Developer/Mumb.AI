[build]
  publish = "."
  functions = "netlify/functions"

# API routes (keep this FIRST)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# 🔥 IMPORTANT: Frontend fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
