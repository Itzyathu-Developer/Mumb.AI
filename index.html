/* =========================================================================================
   DATA LAYER
   Deterministic seed-based pseudo-random generator so demo results are stable per input,
   rather than re-rolling on every render. This stands in for a real signals/data backend.
   ========================================================================================= */

function seedFromString(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

const SCENARIOS = {

const WEIGHTS = { deadline: 0.32, cost: 0.21, crowd: 0.24, reliability: 0.15, distance: 0.08 };

/* =========================================================================================
   DECISION ENGINE
   Structured, deterministic logic. No LLM call is required for scoring/ranking/simulation —
   an AI model (or the fallback parser below) is only used to interpret the natural-language
   goal into structured constraints.
   ========================================================================================= */

// Deterministic fallback parser — runs with no AI key required, so the app never breaks.
function parseGoalFallback(text, scenarioKey){
  const t = (text || '').toLowerCase();

  // Deadline: "7 pm", "7:30pm", "before 1 PM"
  let deadlineMinutes = null, deadlineLabel = null;
  const timeMatch = t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  if (timeMatch) {
    let hh = parseInt(timeMatch[1], 10) % 12;
    const mm = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
    if (timeMatch[3] === 'pm') hh += 12;
    deadlineMinutes = hh * 60 + mm;
    const dispH = ((hh + 11) % 12) + 1;
    deadlineLabel = `${dispH}:${String(mm).padStart(2,'0')} ${timeMatch[3].toUpperCase()}`;
  }

  // Budget: ₹100, rs 100, under 100, inr 100
  let budget = null;
  const budgetMatch = t.match(/(?:₹|rs\.?|inr)\s?(\d{2,5})/) || t.match(/(?:under|less than|below)\s?(?:₹|rs\.?|inr)?\s?(\d{2,5})/);
  if (budgetMatch) budget = parseInt(budgetMatch[1], 10);

  // Crowd preference
  let crowdPref = 'medium';
  if (/avoid.*crowd|no crowd|low crowd|less crowd|quiet/.test(t)) crowdPref = 'low';
  else if (/busy is fine|crowd.*(ok|fine)|don'?t mind crowd/.test(t)) crowdPref = 'high';

  // Distance (rough, defaults per scenario if absent)
  const defaults = { commute: 6.2, wait: 0.4, outing: 3.5 };
  const distanceKm = defaults[scenarioKey] ?? 5;

  const defaultBudget = { commute: 100, wait: 50, outing: 300, ask: 100 }[scenarioKey] ?? 100;
  const defaultDeadline = { commute: 19*60, wait: 13*60, outing: 21*60, ask: 19*60 }[scenarioKey] ?? 19*60;

  return {
    deadlineMinutes: deadlineMinutes ?? defaultDeadline,
    deadlineLabel: deadlineLabel ?? minutesToLabel(deadlineMinutes ?? defaultDeadline),
    deadlineInferred: deadlineMinutes === null,
    budget: budget ?? defaultBudget,
    budgetInferred: budget === null,
    crowdPref,
    distanceKm,
  };
}

function minutesToLabel(mins){
  const h = Math.floor(mins/60), m = mins%60;
  const disp = ((h + 11) % 12) + 1;
  return `${disp}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}

// Generates a set of candidate options for a scenario. Deterministic per goal text so demo
// results are reproducible, but still responsive to what the user actually typed.
function generateOptions(constraints, scenarioKey){
  const scenario = SCENARIOS[scenarioKey];
  const rand = seedFromString(scenarioKey + '|' + constraints.budget + '|' + constraints.deadlineMinutes + '|' + constraints.crowdPref);
  const baseEta = 18 + Math.floor(rand() * 20);
  const count = 3 + (rand() > 0.6 ? 1 : 0);

  const crowdLevels = ['Low','Medium','High'];
  const riskLevels = ['Low','Medium','High'];

  const options = [];
  for (let i = 0; i < count; i++){
    const etaJitter = Math.round((rand()-0.35) * 26);
    const eta = Math.max(6, baseEta + etaJitter + i*4);
    const costBase = Math.round(constraints.budget * (0.35 + rand()*0.95));
    const crowdIdx = Math.min(2, Math.floor(rand()*3));
    const riskIdx = Math.min(2, Math.floor(rand()*3));
    const reliability = Math.round((0.62 + rand()*0.36) * 100) / 100;
    options.push({
      id: 'opt_' + i,
      name: scenario.names[i % scenario.names.length],
      etaMinutes: eta,
      cost: Math.max(0, costBase),
      crowd: crowdLevels[crowdIdx],
      risk: riskLevels[riskIdx],
      reliability,
      distanceKm: Math.round((constraints.distanceKm * (0.7 + rand()*0.6)) * 10) / 10,
    });
  }
  return options;
}

function crowdScore(level){ return level === 'Low' ? 1 : level === 'Medium' ? 0.55 : 0.15; }
function riskScore(level){ return level === 'Low' ? 1 : level === 'Medium' ? 0.5 : 0.1; }

// Pure scoring function — reused for both the initial recommendation and every
// What-If recalculation, so behavior stays identical and fully deterministic.
function scoreOptions(options, constraints, nowMinutes){
  const maxCost = Math.max(1, ...options.map(o => o.cost), constraints.budget);
  return options.map(o => {
    const arrival = nowMinutes + o.etaMinutes;
    const slack = constraints.deadlineMinutes - arrival;
    const deadlineFit = slack >= 0 ? Math.min(1, 0.55 + slack/60) : Math.max(0, 1 + slack/25);
    const costFit = o.cost <= constraints.budget
      ? 1 - (o.cost / (constraints.budget * 1.6))
      : Math.max(0, 0.35 - (o.cost - constraints.budget)/maxCost);
    const crowdTolerance = constraints.crowdPref === 'low' ? 1 : constraints.crowdPref === 'high' ? 0.55 : 0.8;
    const cScore = crowdScore(o.crowd) * crowdTolerance + (1-crowdTolerance)*0.5;
    const relScore = o.reliability;
    const distFit = Math.max(0, 1 - o.distanceKm / (constraints.distanceKm * 2.2 + 0.001));

    const total =
      WEIGHTS.deadline * clamp01(deadlineFit) +
      WEIGHTS.cost * clamp01(costFit) +
      WEIGHTS.crowd * clamp01(cScore) +
      WEIGHTS.reliability * clamp01(relScore) +
      WEIGHTS.distance * clamp01(distFit);

    return {
      ...o,
      arrival,
      meetsDeadline: slack >= 0,
      score: total,
      breakdown: { deadline: clamp01(deadlineFit), cost: clamp01(costFit), crowd: clamp01(cScore), reliability: clamp01(relScore), distance: clamp01(distFit) },
    };
  }).sort((a,b) => b.score - a.score);
}

function clamp01(n){ return Math.max(0, Math.min(1, n)); }

function buildRecommendation(scored, constraints, nowMinutes){
  const best = scored[0];
  const second = scored[1];
  const margin = second ? best.score - second.score : 0.25;
  const confidence = Math.round(clamp01(0.55 + margin*1.6 + best.score*0.25) * 100);
  const baselineEta = Math.max(...scored.map(o=>o.etaMinutes));
  const timeSaved = Math.max(0, baselineEta - best.etaMinutes);
  return { best, second, confidence: Math.min(97, Math.max(41, confidence)), timeSaved, nowMinutes };
}

/* =========================================================================================
   SIMULATION LAYER — Time Machine + Weekly Optimizer demo generators
   ========================================================================================= */

function timeMachineSlots(constraints, scenarioKey){
  const rand = seedFromString('tm|' + scenarioKey + '|' + constraints.budget);
  const centers = [18*60, 18.5*60, 19*60, 19.5*60, 20*60];
  const labels = ['6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM'];
  // Rush-hour bell curve peaking near 7:00–7:30 PM
  return centers.map((c, i) => {
    const peak = 19*60 + 15;
    const dist = Math.abs(c - peak);
    const congestion = Math.max(0, 1 - dist/90);
    const base = 16 + Math.round(rand()*6);
    const eta = Math.round(base + congestion * 26);
    return { label: labels[i], minutes: c, eta };
  });
}

/* =========================================================================================
   ANALYZE FLOW — cinematic staged sequence
   ========================================================================================= */

const STAGE_LABELS = ['Understanding your goal', 'Gathering signals', 'Simulating possibilities', 'Optimizing'];

function AnalyzeFlow({ goalText, setGoalText, scenarioKey, setScenarioKey, stage, setStage, constraints, options, onRunAnalysis, isDemo, aiReady }){
  useEffect(() => {
    if (stage === 0 || stage > 4) return;
    if (stage >= 3 && !aiReady) return;
    const t = setTimeout(() => setStage(s => Math.min(4, s+1)), isDemo ? 900 : 650);
    return () => clearTimeout(t);
  }, [stage]);

  return (
    <section className="max-w-5xl mx-auto px-5 md:px-8 py-10 md:py-16">
      <div className="glass-strong rounded-2xl p-2.5">
        <textarea
          value={goalText}
          onChange={e => setGoalText(e.target.value)}
          rows={2}
          className="w-full bg-transparent resize-none px-4 pt-3 pb-1 text-[15px] md:text-base placeholder:text-[var(--ink-2)] focus:outline-none"
          placeholder={SCENARIOS[scenarioKey].placeholder}
        />
        <div className="flex items-center justify-between px-2 pb-1.5 pt-2">
          <div className="flex gap-1.5">
            {Object.values(SCENARIOS).map(s => (
              <button key={s.key} onClick={()=>setScenarioKey(s.key)}
                className={`text-[11px] font-mono px-2.5 py-1 rounded-full border ${scenarioKey===s.key ? 'border-cyan-300/40 text-cyan-200 bg-cyan-300/[0.06]' : 'border-white/10 text-[var(--ink-2)]'}`}>
                {s.label}
              </button>
            ))}
          </div>
          <button onClick={onRunAnalysis} className="inline-flex items-center gap-2 rounded-xl px-5 py-2.5 font-medium text-sm text-[#04110E]" style={{backgroundImage:'var(--grad)'}}>
            {scenarioKey === 'ask' ? 'Get detailed answer' : stage>0 ? 'Re-analyze' : 'Analyze my decision'} <Icon name="arrow" className="w-4 h-4" strokeWidth={2.2}/>
          </button>
        </div>
      </div>

      {stage > 0 && (
        <div className="mt-10">
          <StageTracker stage={stage} />
          <div className="mt-8">
            {stage === 1 && <StageUnderstanding constraints={constraints} />}
            {stage === 2 && <StageGathering />}
            {stage === 3 && <StageSimulating options={aiReady ? options : []} />}
            {stage === 4 && <StageOptimizing options={options} constraints={constraints} />}
          </div>
        </div>
      )}
    </section>
  );
}

function StageTracker({ stage }){
  return (
    <div className="flex items-center gap-2 md:gap-3" role="status" aria-live="polite">
      {STAGE_LABELS.map((label, i) => {
        const idx = i+1;
        const state = stage > idx ? 'done' : stage === idx ? 'active' : 'pending';
        return (
          <React.Fragment key={label}>
            <div className="flex items-center gap-2">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-mono border
                ${state==='done' ? 'bg-cyan-300/15 border-cyan-300/40 text-cyan-200' :
                  state==='active' ? 'border-cyan-300/60 text-cyan-200' : 'border-white/10 text-[var(--ink-2)]'}`}>
                {state==='done' ? <Icon name="check" className="w-3 h-3" strokeWidth={2.4}/> : idx}
              </span>
              <span className={`text-xs md:text-[13px] hidden sm:inline ${state==='pending' ? 'text-[var(--ink-2)]' : 'text-[var(--ink-0)]'}`}>{label}</span>
            </div>
            {idx < 4 && <span className="flex-1 h-px bg-white/10 min-w-[10px]" />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function StageUnderstanding({ constraints }){
  const chips = [
    { label: 'Deadline', value: constraints.deadlineLabel, inferred: constraints.deadlineInferred },
    { label: 'Budget', value: `₹${constraints.budget}`, inferred: constraints.budgetInferred },
    { label: 'Crowd preference', value: constraints.crowdPref, inferred: false },
    { label: 'Distance', value: `${constraints.distanceKm} km`, inferred: false },

  return (
    <div className="grid sm:grid-cols-2 md:grid-cols-4 gap-3 anim-fadeUp">
      {chips.map((c, i) => (

          <p className="font-display text-lg mt-1 capitalize">{c.value}</p>
          {c.inferred && <p className="text-[11px] text-[var(--ink-2)] mt-1">Inferred default — not stated</p>}
        </div>
      ))}
    </div>
  );
}

function StageGathering(){
  const signals = [

function StageSimulating({ options }){

function StageOptimizing({ options, constraints }){

const OBSERVATION_TYPES = ['Crowd low','Crowd medium','Crowd high','Queue 0–5 min','Queue 5–15 min','Queue 15–30 min','Delayed','On time','Route blocked','Service unavailable','Other'];

function timeAgo(ts){
  const mins = Math.max(0, Math.round((Date.now()-ts)/60000));
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  return `${Math.round(mins/60)}h ago`;
}
function relevanceFor(ts){
  const mins = (Date.now()-ts)/60000;
  return Math.max(0.08, Math.exp(-mins/45));
}

function formatPostedAt(ts){
  return new Intl.DateTimeFormat('en-IN', {
    dateStyle: 'medium',
    timeStyle: 'short',
  }).format(new Date(ts));
}

function analyzeObservation({ category, context, note }){
  const cleanContext = context.trim();
  const cleanNote = note.trim();
  const categoryRequiresEvidence = category !== 'Other';

  const addressParts = cleanContext.split(',').map(part => part.trim()).filter(Boolean);
  const hasHouseOrLandmarkNumber = /\b\d+[A-Za-z]?(?:[-/]\d+)?\b/.test(cleanContext);
  if (addressParts.length < 2 || cleanContext.length < 12 || !hasHouseOrLandmarkNumber) {
    return { approved: false, reason: 'Enter a full address with a number or landmark, street/locality, and area.' };
  }
  if (cleanNote.length < 8) {
    return { approved: false, reason: 'Add a short factual note describing what you observed.' };
  }
  if (categoryRequiresEvidence && !/[a-z]{3}/i.test(cleanNote)) {
    return { approved: false, reason: 'The note needs enough detail for Mumb.AI to evaluate this observation.' };
  }

  return {
    approved: true,
    points: cleanNote.length >= 30 ? POINT_VALUES.detailedObservation : POINT_VALUES.observation,
  };
}

async function analyzeObservationWithAI(payload){
  const localCheck = analyzeObservation(payload);
  if (!localCheck.approved) return localCheck;
  try {
    const response = await fetch(`${API_BASE}/api/analyze-observation`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error('AI verifier unavailable');
    return await response.json();
  } catch {
    return analyzeObservation(payload);
  }
}

async function askMumbAI(question){
  try {
    const response = await fetch(`${API_BASE}/.netlify/functions/ask-nexus`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!response.ok) {
      const detail = await response.text();
      throw new Error(`Answer service failed (${response.status})${detail ? `: ${detail.slice(0, 180)}` : ''}`);
    }
    const payload = await response.json();
    if (!payload.answer || !payload.answer.trim()) throw new Error('Empty answer');
    return payload.answer;
  } catch (error) {
    console.error('Mumb.AI request failed:', error);
    return `Mumb.AI could not reach the deployed AI service. ${error.message} Please redeploy the latest version and check the Netlify function logs.`;
  }
}

async function analyzeDecisionWithAI({ goal, scenario, communitySignals }){

function buildLocalAnswer(question){
  const lower = question.toLowerCase().trim();
  if (/^(hi|hello|hey|namaste)\b/.test(lower)) {
    return 'Hello. I am Mumb.AI, your Mumbai decision assistant. Ask me about routes, local trains, Metro, food, neighbourhoods, budgets, day plans, or any everyday question.';
  }
  if (/what can you do|what do (you|u) do|who are you|what is Mumb\.AI/.test(lower)) {
    return 'I turn a real-world question into a practical plan. I can explain Mumbai transport, compare routes, estimate time and cost, suggest food or outings, organize a day plan, and make trade-offs clear. I will label estimates instead of pretending that offline information is live.';
  }
  if (/metro|versova|ghatkopar|line 1/.test(lower)) {
    return 'Mumbai Metro Line 1 runs between Versova and Ghatkopar. The station sequence is Versova → D.N. Nagar → Azad Nagar → Andheri → Western Express Highway → Chakala (JB Nagar) → Airport Road → Marol Naka → Saki Naka → Asalpha → Jagruti Nagar → Ghatkopar.\n\nAllow roughly 35–45 minutes for the train journey, plus station access and waiting time. Andheri connects with the Western Line; Ghatkopar connects with the Central Line. Check the operator for current fares, timings, and service notices.';
  }
  if (/local train|railway|churchgate|csmt|dadar|andheri/.test(lower)) {
    return 'Mumbai suburban rail has three main corridors: Western Line (Churchgate ↔ Dahanu Road), Central Line (CSMT ↔ Kalyan, with branches toward Kasara and Karjat), and Harbour Line (CSMT ↔ Panvel, with services toward Goregaon). Dadar is the important Western–Central interchange.\n\nUse slow trains when you need smaller stations and fast trains when your stops are major stations. In peak hours, allow extra time for platforms, interchange walking, and crowding. Live delays and platforms must be checked through an official source.';
  }
  if (/best bus|bus route|bus in mumbai/.test(lower)) {
    return 'BEST buses cover Mumbai and are useful when a railway or Metro station is not close to your destination. For an accurate route, share your starting landmark, destination, and arrival time. A good plan usually compares BEST with the nearest local or Metro station, then adds the last-mile walk or auto. Bus timings and traffic are estimates unless a live feed is connected.';
  }
  if (/food|eat|restaurant|breakfast|lunch|dinner|cafe/.test(lower)) {
    return 'For a Mumbai food plan, choose by area and budget. South Mumbai works well for a Kala Ghoda or Fort food walk; Bandra has cafés and casual restaurants; Lower Parel has mall and office-district options; Dadar is strong for Maharashtrian snacks. Tell me your area, dietary preference, budget per person, and whether you want quick service or a sit-down meal.';
  }
  if (/outing|visit|places|tourist|day out|weekend/.test(lower)) {
    return 'A relaxed Mumbai day can combine one anchor place with short nearby stops: Marine Drive and Kala Ghoda for South Mumbai, Bandra Fort and Bandstand for the western side, or Sanjay Gandhi National Park for greenery. Keep one flexible hour for traffic and crowds. Share your starting area, available hours, budget, and crowd preference for a precise plan.';
  }
  if (/weather|rain|temperature|hot|monsoon/.test(lower)) {
    return 'I cannot see live Mumbai weather from this offline page. For a reliable current answer, check an official weather service. In a plan, keep a rain buffer during monsoon, protect electronics, and prefer routes with covered station access when possible.';
  }
  if (/cost|fare|price|budget|cheap|expensive/.test(lower)) {
    return 'The right Mumbai budget depends on the transport mode, distance, and time of day. Local trains and Metro are usually the lower-cost backbone; BEST and autos help with last-mile travel; ride-hailing is more variable during rain and peak demand. Share the route and your maximum budget and I will compare the options.';
  }
  if (/^what is |^who is |^why |^how /.test(lower)) {
    return `Here is the clearest way to approach that: ${question.trim()} is best answered with the specific context, place, or goal involved. I can give you a precise explanation or plan if you add one detail about what you need to decide. I will separate known information, estimates, and assumptions.`;
  }
  return `I understand your question: “${question.trim()}”\n\nI can work through it step by step. Tell me the place or context, what outcome you want, your time limit, and your budget if money is involved. I will give you a direct recommendation, alternatives, trade-offs, and any uncertainty instead of repeating a generic travel message.`;
}

function reviewSummary(observation){
  if (observation.isAiGenerated) return { tone: 'ai', label: 'AI-generated demo', total: 0 };
  const confirmations = observation.confirmations || 0;
  const corrections = observation.corrections || 0;
  if (corrections > confirmations) return { tone: 'danger', label: 'Needs review', total: confirmations + corrections };
  if (confirmations > 0) return { tone: 'verified', label: 'Confirmed by community', total: confirmations + corrections };
  return { tone: 'community', label: 'Awaiting community review', total: 0 };
}

function makeSeededRandom(seed) {
  let value = 0;
  for (let i = 0; i < seed.length; i++) {
    value = (value * 31 + seed.charCodeAt(i)) % 2147483647;
  }
  return () => {
    value = (value * 48271) % 2147483647;
    return (value & 0x7fffffff) / 2147483647;
  };
}

function buildDemoSignals(seed, count = 3) {
  const rand = makeSeededRandom(seed.toString());
  const selected = [];
  const available = [...DEMO_SIGNAL_TEMPLATES];
  for (let i = 0; i < count && available.length; i++) {
    const index = Math.floor(rand() * available.length);
    const item = available.splice(index, 1)[0];
    selected.push({
      ...item,
      id: `demo_${seed}_${i}`,
      authorId: `demo_user_${seed}_${i}`,
      ts: Date.now() - Math.round(rand() * 45 * 60000),
    });
  }
  return selected;
}

function getOrCreateDemoSeed() {
  try {
    const key = 'Mumb.AI-demo-seed';
    const existing = localStorage.getItem(key);
    if (existing) return existing;
    const seed = `${Date.now()}-${Math.floor(Math.random() * 1e9)}`;
    localStorage.setItem(key, seed);
    return seed;
  } catch {
    return String(Date.now());
  }
}

function getOrCreateDemoSignals() {
  const key = 'Mumb.AI-demo-signals';
  try {
    const stored = JSON.parse(localStorage.getItem(key) || 'null');
    if (Array.isArray(stored) && stored.length >= 3) return stored;
  } catch {}
  const seed = getOrCreateDemoSeed();
  const signals = buildDemoSignals(seed, 3).map(signal => ({ ...signal, isAiGenerated: true }));
  try {
    localStorage.setItem(key, JSON.stringify(signals));
  } catch {}
  return signals;
}

function ScrollProgress(){
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const update = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(max > 0 ? (window.scrollY / max) * 100 : 0);
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, []);
  return <div className="scroll-progress" style={{ width: `${progress}%` }} aria-hidden="true" />;
}

async function hashPassword(password){
  const data = new TextEncoder().encode(password);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
}

    e.preventDefault();
    if (!email.trim() || (mode === 'signup' && !name.trim())) {
      setMessage(mode === 'signup' ? 'Enter your name and email.' : 'Enter your email.');
      return;
    }
    if (password.length < 8) {
      setMessage('Password must be at least 8 characters.');
      return;

    const passwordHash = await hashPassword(password);

        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password (8+ characters)" className="w-full surface rounded-lg px-3 py-2.5 mt-3 text-sm bg-transparent placeholder:text-[var(--ink-2)]" autoComplete={mode === 'signup' ? 'new-password' : 'current-password'} />
        {message && <p className="text-xs text-amber-300 mt-3">{message}</p>}
        <button type="submit" disabled={submitting} className="w-full rounded-xl py-2.5 mt-5 text-sm font-medium text-[#04110E] disabled:opacity-50" style={{backgroundImage:'var(--grad)'}}>{submitting ? 'Checking…' : mode === 'signup' ? 'Create account' : 'Sign in'}</button>
        <button type="button" onClick={() => { setMode(mode === 'signup' ? 'signin' : 'signup'); setMessage(''); }} className="w-full text-xs text-[var(--ink-1)] mt-4">{mode === 'signup' ? 'Already have an account? Sign in' : 'New here? Sign up'}</button>
        <p className="text-[11px] text-[var(--ink-2)] mt-4 text-center">Prototype account: password hash and progress are saved only in this browser.</p>
      </form>
    </div>
  );
}

function normalizeEmail(email){
  return String(email || '').trim().toLowerCase();
}

function normalizeAccountStore(store){
  if (!store || typeof store !== 'object') return {};
  return Object.keys(store).reduce((acc, key) => {
    const email = normalizeEmail(key);
    if (!email) return acc;
    const account = store[key] || {};
    acc[email] = {
      ...account,
      email,
      observations: Array.isArray(account.observations) ? account.observations : [],
      timePoints: account.timePoints ?? 0,
      rewardDecision: account.rewardDecision ?? null,
      premiumExpiresAt: account.premiumExpiresAt ?? 0,
      trialExpiresAt: account.trialExpiresAt ?? 0,
    };
    return acc;
  }, {});
}

function readAccountStore(){
  try {
    const stored = JSON.parse(localStorage.getItem('Mumb.AI-accounts') || '{}');
    const normalized = normalizeAccountStore(stored);
    if (Object.keys(normalized).length) return normalized;
    const legacy = JSON.parse(localStorage.getItem('Mumb.AI-account') || 'null');
    if (legacy?.email) {
      const email = normalizeEmail(legacy.email);
      return email ? { [email]: { ...legacy, email } } : {};
    }
    return {};
  } catch { return {}; }
}

function RewardChoiceModal({ timePoints, onRedeem, onStore }){
  return (
    <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center px-5" role="dialog" aria-modal="true" aria-labelledby="reward-title">
      <div className="glass-strong rounded-2xl p-6 w-full max-w-md">
        <p className="text-[11px] font-mono uppercase tracking-widest text-amber-300">Reward unlocked</p>
        <h2 id="reward-title" className="font-display text-2xl mt-2">You have {timePoints} TimePoints.</h2>
        <p className="text-sm text-[var(--ink-1)] mt-3 leading-relaxed">Choose what to do with 30 points. Redeem them for 3 days of Mumb.AI PRO, or store them and keep building your balance.</p>
        <div className="grid sm:grid-cols-2 gap-3 mt-6">
          <button onClick={onRedeem} className="rounded-xl px-4 py-3 text-sm font-medium text-[#04110E]" style={{backgroundImage:'var(--grad)'}}>Redeem 30 · 3 days PRO</button>
          <button onClick={onStore} className="surface rounded-xl px-4 py-3 text-sm text-[var(--ink-0)]">Store points</button>
        </div>
        <p className="text-[11px] text-[var(--ink-2)] mt-4">Redeem: 30 points are deducted. Store: your points remain unchanged.</p>
      </div>
    </div>
  );
}

/* =========================================================================================
   ROOT APP
   ========================================================================================= */

function App(){
  const [view, setView] = useState('home');
  const [scenarioKey, setScenarioKey] = useState('ask');
  const [goalText, setGoalText] = useState('');
  const [stage, setStage] = useState(0);
  const [hasDecision, setHasDecision] = useState(false);
  const [aiDecision, setAiDecision] = useState(null);
  const [answer, setAnswer] = useState('');
  const [answerLoading, setAnswerLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [demoActive, setDemoActive] = useState(false);
  const [rewardChoiceOpen, setRewardChoiceOpen] = useState(false);
  const [account, setAccount] = useState(() => {
    const accounts = readAccountStore();
    try {
      const email = normalizeEmail(JSON.parse(localStorage.getItem('Mumb.AI-active-email') || 'null'));
      return email ? accounts[email] || null : null;
    } catch {
      return null;
    }
  });
  const [authMode, setAuthMode] = useState(null);

  const [timePoints, setTimePoints] = useState(() => {
    const accounts = readAccountStore();
    try {
      const email = normalizeEmail(JSON.parse(localStorage.getItem('Mumb.AI-active-email') || 'null'));
      return email ? accounts[email]?.timePoints ?? 0 : 0;
    } catch {
      return 0;
    }
  });
  const [observations, setObservations] = useState(() => {
    const accounts = readAccountStore();
    try {
      const email = normalizeEmail(JSON.parse(localStorage.getItem('Mumb.AI-active-email') || 'null'));
      const userObservations = email ? accounts[email]?.observations ?? [] : [];
      return [...buildDemoSignals(getOrCreateDemoSeed(), 3), ...userObservations];
    } catch {
      return buildDemoSignals(getOrCreateDemoSeed(), 3);
    }
  });
  const lastSubmitRef = useRef({});

  useEffect(() => {
    let active = true;
    generateCommunityPostsWithAI('commute').then(posts => {
      if (!active) return;
      setObservations(current => {
        const userObservations = current.filter(observation => !observation.isAiGenerated);
        const generated = posts.slice(0, 3).map((post, index) => ({
          ...post,
          id: `ai_${Date.now()}_${index}`,
          authorId: `ai_user_${index}`,
          ts: Date.now() - index * 7 * 60 * 1000,
          isAiGenerated: true,
        }));
        return [...generated, ...userObservations];
      });
    }).catch(error => console.warn('Mumb.AI community generation unavailable:', error));
    return () => { active = false; };
  }, []);

  useEffect(() => {
    if (account) {
      const accounts = readAccountStore();
      const updated = { ...account, timePoints, observations };
      accounts[account.email] = updated;
      localStorage.setItem('Mumb.AI-accounts', JSON.stringify(accounts));
      localStorage.setItem('Mumb.AI-account', JSON.stringify(updated));
      localStorage.setItem('Mumb.AI-active-email', JSON.stringify(account.email));
    }
  }, [account, timePoints, observations]);

  useEffect(() => {
    if (account && timePoints >= PREMIUM_THRESHOLD && account.rewardDecision !== 'redeemed' && account.rewardPromptAt !== timePoints) setRewardChoiceOpen(true);
  }, [account, timePoints]);

  const fallbackConstraints = useMemo(() => parseGoalFallback(goalText, scenarioKey), [goalText, scenarioKey]);
  const constraints = useMemo(() => {
    if (aiDecision?.scenario !== scenarioKey) return fallbackConstraints;
    return { ...fallbackConstraints, ...aiDecision.constraints };
  }, [aiDecision, fallbackConstraints, scenarioKey]);
  const options = useMemo(() => {
    if (scenarioKey === 'ask') return [];
    if (aiDecision?.scenario === scenarioKey && aiDecision.options?.length) return aiDecision.options;
    return generateOptions(constraints, scenarioKey);
  }, [aiDecision, scenarioKey, constraints]);

  const [whatIf, setWhatIf] = useState({ budget: constraints.budget, crowdTolerance: constraints.crowdPref, deadlineOffset: 0 });
  useEffect(() => { setWhatIf({ budget: constraints.budget, crowdTolerance: constraints.crowdPref, deadlineOffset: 0 }); }, [scenarioKey]);
  const [recalculating, setRecalculating] = useState(false);
  const recalcTimer = useRef(null);
  const bumpRecalc = useCallback(() => {
    setRecalculating(true);
    clearTimeout(recalcTimer.current);
    recalcTimer.current = setTimeout(() => setRecalculating(false), 700);
  }, []);
  const setWhatIfTracked = useCallback((updater) => { setWhatIf(updater); bumpRecalc(); }, [bumpRecalc]);

  const scoredMain = useMemo(() => scenarioKey === 'ask' ? [] : scoreOptions(options, constraints, 18*60), [scenarioKey, options, constraints]);
  const rec = useMemo(() => scenarioKey === 'ask' ? null : buildRecommendation(scoredMain, constraints, 18*60), [scenarioKey, scoredMain]);
  const [showExplain, setShowExplain] = useState(false);

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); }, []);

  const handleAuthSubmit = useCallback(async ({ name, email, passwordHash }) => {
    const accounts = readAccountStore();
    const normalizedEmail = normalizeEmail(email);
    if (!normalizedEmail) return { error: 'Enter a valid email address.' };
    const saved = accounts[normalizedEmail] || Object.values(accounts).find(acc => normalizeEmail(acc.email) === normalizedEmail) || null;
    if (authMode === 'signup' && saved) return { error: 'This email is already registered. Sign in with it instead.' };
    if (authMode === 'signin' && !saved) return { error: 'No local account found for this email. Sign up first.' };
    if (authMode === 'signin' && !saved?.passwordHash) return { error: 'This older account has no password. Sign up again with a new email.' };
    if (authMode === 'signin' && saved.passwordHash !== passwordHash) return { error: 'Incorrect email or password.' };
    const next = authMode === 'signin'
      ? saved
      : { name, email: normalizedEmail, passwordHash, timePoints: 15, observations: [], welcomeBonusGranted: true, trialExpiresAt: Date.now() + 5 * 60 * 60 * 1000, rewardDecision: null, premiumExpiresAt: 0 };
    setAccount(next);
    setTimePoints(next.timePoints ?? 0);
    setObservations(next.observations ?? []);
    setAuthMode(null);
    showToast(authMode === 'signup' ? 'Welcome to Mumb.AI — +15 TP and 5-hour PRO trial activated.' : 'Signed in — your credits are restored.');
    return {};
  }, [authMode, showToast]);

  const signOut = useCallback(() => {
    setAccount(null);
    setTimePoints(0);
    setObservations([]);
    localStorage.removeItem('Mumb.AI-active-email');
    showToast('Signed out. Your saved progress remains on this browser.');
  }, [showToast]);

  const redeemPoints = useCallback(() => {
    if (!account || timePoints < PREMIUM_THRESHOLD) return;
    setTimePoints(points => points - PREMIUM_THRESHOLD);
    setAccount(current => ({ ...current, rewardDecision: 'redeemed', rewardPromptAt: timePoints, premiumExpiresAt: Date.now() + PREMIUM_DAYS * 24 * 60 * 60 * 1000 }));
    setRewardChoiceOpen(false);
    showToast(`30 TP redeemed — ${PREMIUM_DAYS} days of Mumb.AI PRO unlocked.`);
  }, [account, timePoints, showToast]);

  const storePoints = useCallback(() => {
    setAccount(current => ({ ...current, rewardDecision: 'stored', rewardPromptAt: timePoints }));
    setRewardChoiceOpen(false);
    showToast('Points stored. You can keep building your balance.');
  }, [showToast]);

  const askQuestion = useCallback((question) => {
    setGoalText(question);
    setScenarioKey('ask');
    setView('answer');
    setAnswer('');
    setAnswerLoading(true);
    askMumbAI(question).then(result => { setAnswer(result); setAnswerLoading(false); });
  }, []);

  const runAnalysis = useCallback(async (isDemo=false, requestedGoal=goalText) => {
    if (!isDemo && !requestedGoal.trim()) {
      showToast('Enter a goal before analysing your decision.');
      return;
    }
    if (scenarioKey === 'ask') {
      askQuestion(requestedGoal);
      return;
    }
    setAiDecision(null);
    setHasDecision(true);
    setView('analyze');
    setShowExplain(false);
    setStage(1);
    try {
      const result = await analyzeDecisionWithAI({ goal: requestedGoal, scenario: scenarioKey, communitySignals: observations.slice(0, 10) });
      setAiDecision({ ...result, scenario: scenarioKey });
      showToast('Mumb.AI built this decision from your goal and available signals.');
    } catch (error) {
      console.error('Mumb.AI decision analysis failed:', error);
      setHasDecision(false);
      setStage(0);
      showToast('AI analysis unavailable — no decision estimates were created.');
    }
  }, [askQuestion, goalText, observations, scenarioKey, showToast]);

  const addObservation = useCallback(({ category, context, note, onComplete }) => {
    if (!account) {
      showToast('Sign in to earn TimePoints from observations.');
      onComplete?.({ approved: false });
      return;
    }
    const key = category + '|' + context;
    const last = lastSubmitRef.current[key];
    if (last && Date.now() - last < COOLDOWN_MS) {
      showToast('Cooldown active for this exact report — try a different observation.');
      onComplete?.({ approved: false });
      return;
    }
    showToast('Mumb.AI is analysing your observation…');
    setTimeout(async () => {
      const result = await analyzeObservationWithAI({ category, context, note });
      if (!result.approved) {
        showToast(`Not verified — ${result.reason}`);
        onComplete?.(result);
        return;
      }

      lastSubmitRef.current[key] = Date.now();
      setObservations(obs => [{ id: 'obs_'+Date.now(), authorId: CURRENT_USER_ID, category, context: context.trim(), note: note.trim(), ts: Date.now() }, ...obs]);
      setTimePoints(tp => Math.min(999, tp + result.points));
      showToast(`Verified observation · +${result.points} TimePoints.`);
      onComplete?.(result);
    }, 900);
  }, [account, showToast]);

  const reviewObservation = useCallback(({ observationId, type, note = '', observation, onComplete }) => {
    if (!account) {
      showToast('Sign in to review observations and earn TimePoints.');
      onComplete?.({ approved: false });
      return;
    }
    if (observation.authorId === CURRENT_USER_ID) {
      showToast('You cannot review your own observation.');
      onComplete?.({ approved: false });
      return;
    }
    showToast(type === 'correction' ? 'Mumb.AI is analysing the correction…' : 'Mumb.AI is checking community agreement…');
    setTimeout(async () => {
      if (type === 'correction' && note.trim().length < 8) {
        const result = { approved: false, reason: 'Add a specific explanation for the correction.' };
        showToast(`Correction not verified — ${result.reason}`);
        onComplete?.(result);
        return;
      }
      const result = type === 'correction'
        ? await analyzeObservationWithAI({ type, context: observation.context, note, existingObservation: observation })
        : { approved: true };
      if (!result.approved) {
        showToast(`Correction not verified — ${result.reason || 'The evidence was not strong enough.'}`);
        onComplete?.(result);
        return;
      }

      setObservations(current => current.map(observation => observation.id === observationId
        ? { ...observation, confirmations: (observation.confirmations || 0) + (type === 'confirmation' ? 1 : 0), corrections: (observation.corrections || 0) + (type === 'correction' ? 1 : 0) }
        : observation));
      const points = type === 'correction' ? POINT_VALUES.correction : POINT_VALUES.confirmation;
      setTimePoints(tp => Math.min(999, tp + points));
      showToast(`${type === 'correction' ? 'Correction verified' : 'Review recorded'} · +${points} TimePoints.`);
      onComplete?.({ approved: true });
    }, 700);
  }, [account, showToast]);

  const cooldownActive = false;
  const premiumUnlocked = Boolean(account && ((account.trialExpiresAt || 0) > Date.now() || (account.premiumExpiresAt || 0) > Date.now()));

  const startDemo = useCallback(() => {
    setDemoActive(true);
    setScenarioKey('commute');
    setGoalText(SCENARIOS.commute.placeholder);
    showToast('Live demo started — watch the flow below.');
    runAnalysis(true, SCENARIOS.commute.placeholder);
  }, [runAnalysis, showToast]);

  useEffect(() => {
    if (demoActive && stage === 4) {
      const t = setTimeout(() => {
        showToast('Now try What-If mode →');
        setView('simulator');
      }, 1800);
      return () => clearTimeout(t);
    }
  }, [demoActive, stage]);

  return (
    <div className="min-h-screen flex flex-col">
      <ScrollProgress />
      <a href="#main" className="sr-only focus:not-sr-only fixed top-2 left-2 z-50 glass px-3 py-2 rounded-lg">Skip to content</a>
      <NavBar view={view} setView={setView} timePoints={timePoints} premiumUnlocked={premiumUnlocked} account={account}
        onAuthOpen={() => setAuthMode('signup')} onSignOut={signOut} />

      <main id="main" key={view} className="flex-1 view-enter">
        {view === 'home' && (
          <Landing goalText={goalText} setGoalText={setGoalText} scenarioKey={scenarioKey} setScenarioKey={setScenarioKey}
            onAnalyze={() => runAnalysis(false)} onTryDemo={startDemo} />
        )}

        {view === 'answer' && (
          <QuestionAnswer question={goalText} answer={answer} loading={answerLoading} onAsk={askQuestion} />
        )}

        {view === 'analyze' && (
          <>
            <AnalyzeFlow goalText={goalText} setGoalText={setGoalText} scenarioKey={scenarioKey} setScenarioKey={setScenarioKey}
              stage={stage} setStage={setStage} constraints={constraints} options={options}
              onRunAnalysis={() => runAnalysis(false)} isDemo={demoActive} aiReady={Boolean(aiDecision?.scenario === scenarioKey)} />
            {stage >= 4 && aiDecision?.scenario === scenarioKey && (
              <section className="max-w-5xl mx-auto px-5 md:px-8 pb-16 space-y-6">
                <DecisionGraph scored={scoredMain} />
                <RecommendationCard rec={rec} unit={SCENARIOS[scenarioKey].unit} onExplain={() => setShowExplain(s=>!s)} showExplain={showExplain} constraints={constraints} />
              </section>
            )}
          </>
        )}

        {view === 'simulator' && (
            <WhatIfSimulator scenarioKey={scenarioKey} baseConstraints={constraints} options={options} aiDecision={aiDecision}
            whatIf={whatIf} setWhatIf={setWhatIfTracked} recalculating={recalculating} premiumUnlocked={premiumUnlocked} hasDecision={hasDecision} account={account} onAuthOpen={() => setAuthMode('signup')} />
        )}

        {view === 'community' && (
          <CommunitySignals observations={observations} addObservation={addObservation} reviewObservation={reviewObservation} cooldownActive={cooldownActive} />
        )}

        {view === 'timemachine' && (
          <TimeMachine scenarioKey={scenarioKey} constraints={constraints} aiDecision={aiDecision} premiumUnlocked={premiumUnlocked} account={account} onAuthOpen={() => setAuthMode('signup')} hasDecision={hasDecision} />
        )}

        {view === 'wallet' && (
          <TimeWallet timePoints={timePoints} communityCount={observations.length} premiumUnlocked={premiumUnlocked} />
        )}

        {view === 'premium' && (
          <Premium timePoints={timePoints} premiumUnlocked={premiumUnlocked} account={account} onAuthOpen={() => setAuthMode('signup')} />
        )}

        {view === 'about' && <About />}
      </main>

      <footer className="border-t border-white/[0.06] py-8 mt-8">
        <div className="max-w-6xl mx-auto px-5 md:px-8 flex flex-col gap-4 text-[12px] text-[var(--ink-2)]">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
            <a href="#main" className="inline-flex items-center gap-2 text-cyan-300 hover:text-cyan-200 transition-colors">
              <Icon name="spark" className="w-4 h-4" />
              <span>Mumb.AI Mumbai — Reality Decision Engine</span>
            </a>
            <span>· Created by Yatharth Bochare (@itzyathu_12) · For contact information, please <a href="https://itzyathu.netlify.app/contact" className="text-cyan-300 hover:text-cyan-200 transition-colors">contact us</a></span>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            {NAV_ITEMS.slice(1).map(item => (
              <button key={item.key}
                type="button"
                onClick={() => setView(item.key)}
                className={`px-3 py-2 rounded-lg text-xs transition-colors ${view === item.key ? 'text-[var(--ink-0)] bg-white/[0.07]' : 'text-[var(--ink-1)] hover:text-[var(--ink-0)] hover:bg-white/[0.04]'}`}
              >
                {item.label}
              </button>
            ))}
          </div>
          <devnote> Mumbai is our first city. We are working to add more cities. AI Result Maybe Wrong, So recheck.</devnote>
        </div>
      </footer>

      <Toast message={toast} />
      {authMode && <AuthModal mode={authMode} setMode={setAuthMode} onClose={() => setAuthMode(null)} onSubmit={handleAuthSubmit} />}
      {rewardChoiceOpen && <RewardChoiceModal timePoints={timePoints} onRedeem={redeemPoints} onStore={storePoints} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
